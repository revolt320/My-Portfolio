name: Deploy static content to Pages

on:
  push:
    branches: ["main"]  # or "master" depending on your repo

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4   # ✅ update to v4
      - name: Setup Pages
        uses: actions/configure-pages@v4   # ✅ update to v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3   # ✅ update to v3
        with:
          path: '.'   # change if your index.html is in a subfolder
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4   # ✅ update to v4
